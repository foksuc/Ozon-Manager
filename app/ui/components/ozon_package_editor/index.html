ound:var(--oz-input);color:var(--oz-text)}.context-actions{display:flex;gap:6px;margin-top:8px}.context-actions button{flex:1;border:1px solid var(--oz-border);background:var(--oz-header);color:var(--oz-text);border-radius:8px;padding:7px;cursor:pointer}.context-actions button:hover{background:var(--oz-hover)}.sort-mark{margin-left:5px;font-size:11px}::selection{background:rgba(59,130,255,.35);color:var(--oz-text)}
</style></head><body>
<div class="toolbar"><span id="summary"></span><span>• ЛКМ по заголовку — сортировка • ПКМ по заголовку — фильтр • Shift+ЛКМ / Shift+ПКМ — диапазон • клик по ✓ — все товары</span></div>
<div id="root"></div><div id="context" class="context-menu"><label id="filter-label">Фильтр</label><select id="filter-op" aria-label="Условие фильтра"><option value="contains">Содержит</option><option value="eq">Равно</option><option value="gte">Больше или равно</option><option value="lte">Меньше или равно</option></select><input id="filter-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Значение, например 5%"><div class="context-actions"><button id="filter-apply">Применить</button><button id="filter-clear">Сбросить</button></div></div>
<script>
(function(){const SET="streamlit:setComponentValue",RENDER="streamlit:render",READY="streamlit:componentReady",HEIGHT="streamlit:setFrameHeight";let args={rows:[],selectable:false,selected_ids:[],mode:'readonly'};let state={sortIndex:-1,sortDir:1,filters:{},anchorId:null,selectedIds:new Set(),pendingSelection:false,scrollTop:0,scrollLeft:0};const root=document.getElementById('root'),ctx=document.getElementById('context'),inp=document.getElementById('filter-input'),opSel=document.getElementById('filter-op');
function frameHeight(){let h=Number(args.height);return Number.isFinite(h)?Math.max(180,Math.min(900,h)):360}function applyFrameHeight(){let h=frameHeight();document.documentElement.style.setProperty("--oz-frame-height",h+"px");document.body.style.height=h+"px"}function send(t,d){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t},d||{}),'*')}function val(d){send(SET,{value:d,dataType:'json'})}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function norm(v){return String(v??'').trim().toLocaleLowerCase()}
function num(v,preferPercent){let raw=String(v??'').trim();if(!raw||raw==='—'||raw==='-')return null;let compact=raw.replace(/\u00a0/g,'').replace(/\s/g,'');if(preferPercent){let pm=compact.match(/(-?\d+(?:[.,]\d+)?)%/);if(pm){let pn=Number(pm[1].replace(',','.'));return Number.isFinite(pn)?pn:null}}let m=compact.match(/-?\d+(?:[.,]\d+)?/);if(!m)return null;let n=Number(m[0].replace(',','.'));return Number.isFinite(n)?n:null}
function cmp(a,b){let na=num(a,false),nb=num(b,false);if(na!==null&&nb!==null)return na-nb;return String(a??'').localeCompare(String(b??''),'ru',{numeric:true,sensitivity:'base'})}
function matchesFilter(value,filter){if(!filter||!filter.value)return true;let op=filter.op||'contains',needle=String(filter.value);if(op==='contains')return norm(value).includes(norm(needle));let preferPercent=needle.includes('%');let nv=num(value,preferPercent),nn=num(needle,preferPercent);if(op==='eq'){if(nv!==null&&nn!==null)return Math.abs(nv-nn)<1e-9;return norm(value)===norm(needle)}if(nv===null||nn===null)return false;if(op==='gte')return nv>=nn;if(op==='lte')return nv<=nn;return true}
function applyTheme(theme){let t=theme||{},dark=t.base==='dark',r=document.documentElement.style;if(dark){r.colorScheme='dark';r.setProperty('--oz-page',t.backgroundColor||'#0B121A');r.setProperty('--oz-surface',t.secondaryBackgroundColor||'#141E29');r.setProperty('--oz-header','#192634');r.setProperty('--oz-text',t.textColor||'#F3F6FA');r.setProperty('--oz-muted','#A9B7C5');r.setProperty('--oz-border','#304152');r.setProperty('--oz-border-soft','#263645');r.setProperty('--oz-hover','#1B2A38');r.setProperty('--oz-selected','#153A68');r.setProperty('--oz-input','#101923');r.setProperty('--oz-menu','#172431');r.setProperty('--oz-focus',t.primaryColor||'#276EF1');r.setProperty('--oz-shadow','rgba(0,0,0,.55)');r.setProperty('--oz-scroll','#516579');r.setProperty('--oz-scroll-track','#101923')}else{r.colorScheme='light';r.setProperty('--oz-page',t.backgroundColor||'#F8FAFD');r.setProperty('--oz-surface',t.secondaryBackgroundColor||'#FFFFFF');r.setProperty('--oz-header','#F3F6F9');r.setProperty('--oz-text',t.textColor||'#172133');r.setProperty('--oz-muted','#667685');r.setProperty('--oz-border','#DCE4EC');r.setProperty('--oz-border-soft','#E9EEF3');r.setProperty('--oz-hover','#F3F6F9');r.setProperty('--oz-selected','#E7F1FF');r.setProperty('--oz-input','#FFFFFF');r.setProperty('--oz-menu','#FFFFFF');r.setProperty('--oz-focus',t.primaryColor||'#005BFF');r.setProperty('--oz-shadow','rgba(0,0,0,.16)');r.setProperty('--oz-scroll','#B8C4CF');r.setProperty('--oz-scroll-track','#EDF1F5')}document.body.style.visibility='visible'}
function syncSelection(){const incoming=new Set((args.selected_ids||[]).map(String));if(state.pendingSelection){const local=state.selectedIds;if(incoming.size===local.size&&[...incoming].every(id=>local.has(id)))state.pendingSelection=false;else return;}state.selectedIds=incoming;}
function rememberScroll(){const w=root.querySelector('.table-wrap');if(w){state.scrollTop=w.scrollTop;state.scrollLeft=w.scrollLeft}}function restoreScroll(){const w=root.querySelector('.table-wrap');if(!w)return;w.scrollTop=state.scrollTop||0;w.scrollLeft=state.scrollLeft||0;requestAnimationFrame(()=>{w.scrollTop=state.scrollTop||0;w.scrollLeft=state.scrollLeft||0})}function render(){rememberScroll();let rows=Array.isArray(args.rows)?args.rows:[],cols=rows.length?Object.keys(rows[0]).filter(c=>!c.startsWith('__')):[],filtered=rows.map((r,i)=>({r,i})).filter(x=>cols.every(c=>matchesFilter(x.r[c],state.filters[c])));let ordered=filtered.slice();if(state.sortIndex>=0&&cols[state.sortIndex]){let c=cols[state.sortIndex];ordered.sort((a,b)=>state.sortDir*cmp(a.r[c],b.r[c]))}let selected=new Set(state.selectedIds);let html='<div class="table-wrap"><table><thead><tr>'+(args.selectable?'<th class="select-col select-all" title="Выбрать все видимые товары">✓</th>':'');cols.forEach((c,i)=>{let m=state.sortIndex===i?(state.sortDir>0?'▲':'▼'):'';let f=state.filters[c]?' •':'';html+='<th data-col="'+esc(c)+'" data-index="'+i+'">'+esc(c)+'<span class="sort-mark">'+m+f+'</span></th>'});html+='</tr></thead><tbody>';ordered.forEach(x=>{let r=x.r,idx=x.i,id=String(r.__id??r.product_id??r.SKU??idx);html+='<tr data-index="'+idx+'" data-id="'+esc(id)+'" data-pos="'+ordered.indexOf(x)+'" data-min-discount="'+esc(r.__min_discount??'')+'" data-max-discount="'+esc(r.__max_discount??'')+'" data-base-price="'+esc(r.__base_price??'')+'" data-min-price="'+esc(r.__min_price??'')+'" data-max-price="'+esc(r.__max_price??'')+'" class="'+(selected.has(id)?'selected':'')+'">';if(args.selectable)html+='<td class="select-col"><input type="checkbox" class="row-check" '+(selected.has(id)?'checked':'')+'></td>';cols.forEach(c=>{if(c==='SKU'||c==='sku')html+='<td class="sku-cell"><span class="sku-value">'+esc(r[c])+'</span>'+(args.mode==='package'&&args.allow_remove?'<button class="sku-delete" type="button" aria-label="Удалить товар" title="Удалить товар"><svg class="delete-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 5.25h9M6 5.25V3.5h4v1.75m-5.25 0 .55 7.25h5.4l.55-7.25M6.75 7v3.75M9.25 7v3.75"/></svg></button>':'')+'</td>';else if((c==='Скидка'||c==='discount')&&args.mode==='package')html+='<td class="discount-cell">'+esc(Number(r[c]).toFixed(2))+'%</td>';else if(c==='Новое наличие'&&args.mode==='stocks')html+='<td class="stock-cell">'+esc(r[c])+'</td>';else html+='<td>'+esc(r[c])+'</td>'});html+='</tr>'});html+='</tbody></table></div>';root.innerHTML=html;document.getElementById('summary').textContent=(args.selectable?'Выбрано: '+selected.size+' • ':'')+'Строк: '+filtered.length+' / '+rows.length;applyFrameHeight();send(HEIGHT,{height:frameHeight()});bind(cols);restoreScroll()}
function bind(cols){const w=root.querySelector('.table-wrap');if(w){w.addEventListener('scroll',()=>{state.scrollTop=w.scrollTop;state.scrollLeft=w.scrollLeft},{passive:true})}
root.querySelectorAll('th[data-index]').forEach(th=>{th.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let i=Number(th.dataset.index);if(!Number.isInteger(i))return;if(state.sortIndex===i)state.sortDir*=-1;else{state.sortIndex=i;state.sortDir=1}render()});th.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();openFilter(th.dataset.col,e.clientX,e.clientY)})});
const selectAll=root.querySelector('th.select-all');if(selectAll){selectAll.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let visible=Array.from(root.querySelectorAll('tbody tr')).map(tr=>String(tr.dataset.id));let allSelected=visible.length>0&&visible.every(id=>state.selectedIds.has(id));let sel=new Set(state.selectedIds);if(allSelected)visible.forEach(id=>sel.delete(id));else visible.forEach(id=>sel.add(id));state.selectedIds=sel;state.pendingSelection=true;state.anchorId=visible.length?visible[visible.length-1]:state.anchorId;rememberScroll();emitSelection(sel);render()})}
root.querySelectorAll('tbody tr').forEach(tr=>{let cb=tr.querySelector('.row-check');if(cb){cb.addEventListener('mousedown',e=>{rememberScroll();e.preventDefault()});cb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle(tr.dataset.id,e.shiftKey)})};let selectCell=tr.querySelector('.select-col');if(selectCell)selectCell.addEventListener('click',e=>{if(e.target.closest('.row-check'))return;e.preventDefault();e.stopPropagation();toggle(tr.dataset.id,e.shiftKey)});tr.addEventListener('contextmenu',e=>{if(e.shiftKey){e.preventDefault();e.stopPropagation();rangeSelectTo(String(tr.dataset.id));}});});
root.querySelectorAll('.sku-delete').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const tr=b.closest('tr');if(!tr)return;const pid=String(tr.dataset.id);tr.remove();const body=root.querySelector('tbody');const count=body?body.querySelectorAll('tr').length:0;document.getElementById('summary').textContent='Строк: '+count+' / '+(Array.isArray(args.rows)?args.rows.length:count);b.disabled=true;val({action:'remove',product_id:pid,event_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2))});}));root.querySelectorAll('.discount-cell').forEach(c=>c.addEventListener('dblclick',()=>edit(c)));root.querySelectorAll('.stock-cell').forEach(c=>c.addEventListener('dblclick',()=>editStock(c)))}
function rangeSelectTo(id){id=String(id);let sel=new Set(state.selectedIds);let visible=Array.from(root.querySelectorAll('tbody tr')).map(tr=>String(tr.dataset.id));if(state.anchorId===null){state.anchorId=id;sel.add(id);}else{let a=visible.indexOf(String(state.anchorId)),b=visible.indexOf(id);if(a<0||b<0){state.anchorId=id;sel.add(id);}else{let lo=Math.min(a,b),hi=Math.max(a,b);for(let i=lo;i<=hi;i++)sel.add(visible[i]);}}state.selectedIds=sel;state.pendingSelection=true;rememberScroll();emitSelection(sel);render()}
function emitSelection(sel){val({action:'selection',selected_ids:Array.from(sel).map(String).sort((a,b)=>a.localeCompare(b,'en',{numeric:true}))})}function toggle(id,shift){id=String(id);let sel=new Set(state.selectedIds);let visible=Array.from(root.querySelectorAll('tbody tr')).map(tr=>String(tr.dataset.id));if(shift&&state.anchorId!==null){let a=visible.indexOf(String(state.anchorId)),b=visible.indexOf(id);if(a>=0&&b>=0){let lo=Math.min(a,b),hi=Math.max(a,b);for(let i=lo;i<=hi;i++)sel.add(visible[i])}}else{if(sel.has(id))sel.delete(id);else sel.add(id);state.anchorId=id}state.selectedIds=sel;state.pendingSelection=true;rememberScroll();emitSelection(sel);render(); }
function openFilter(c,x,y){ctx.style.display='block';ctx.style.left=Math.min(x,window.innerWidth-245)+'px';ctx.style.top=Math.min(y,window.innerHeight-170)+'px';document.getElementById('filter-label').textContent='Фильтр: '+c;inp.value='';inp.dataset.col=c;opSel.value=(state.filters[c]&&state.filters[c].op)||'contains';setTimeout(()=>inp.focus(),0)}function applyFilter(){const c=inp.dataset.col;if(!c)return;const value=inp.value.trim();if(value)state.filters[c]={op:opSel.value,value:value};else delete state.filters[c];ctx.style.display='none';render();}function clearFilter(){const c=inp.dataset.col;if(c)delete state.filters[c];ctx.style.display='none';render();}document.getElementById('filter-apply').onclick=(e)=>{e.preventDefault();e.stopPropagation();applyFilter()};document.getElementById('filter-clear').onclick=(e)=>{e.preventDefault();e.stopPropagation();clearFilter()};document.addEventListener('click',e=>{if(!e.target.closest('#context'))ctx.style.display='none'});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();applyFilter();return;}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();ctx.style.display='none';}});
function editStock(cell){if(cell.querySelector('input'))return;let tr=cell.closest('tr'),pid=String(tr.dataset.id),current=parseInt(cell.textContent.trim(),10);if(!Number.isFinite(current)||current<0)current=0;let i=document.createElement('input');i.className='stock-input';i.type='number';i.min='0';i.step='1';i.value=String(current);cell.textContent='';cell.appendChild(i);i.focus();i.select();let done=false;let commit=()=>{if(done)return;done=true;let v=parseInt(i.value,10);if(!Number.isFinite(v)||v<0)v=current;cell.textContent=String(v);val({action:'stock',row_key:pid,stock:v,event_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2))})};i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit()}else if(e.key==='Escape'){e.preventDefault();done=true;render()}});i.addEventListener('blur',commit)}
function edit(cell){if(cell.querySelector('input'))return;let tr=cell.closest('tr'),pid=String(tr.dataset.id),current=parseFloat(cell.textContent.replace('%','').trim()),min=Number(tr.dataset.minDiscount),max=Number(tr.dataset.maxDiscount);if(!Number.isFinite(current))current=Number.isFinite(min)?min:0;if(!Number.isFinite(min))min=0;if(!Number.isFinite(max))max=100;let i=document.createElement('input');i.className='discount-input';i.type='number';i.min=String(min);i.max=String(max);i.step='0.01';i.value=current.toFixed(2);cell.textContent='';cell.appendChild(i);i.focus();i.select();let done=false;let commit=()=>{if(done)return;done=true;let v=parseFloat(i.value);if(!Number.isFinite(v))v=current;v=Math.max(min,Math.min(max,v));v=Number(v.toFixed(2));const base=Number(tr.dataset.basePrice),minPrice=Number(tr.dataset.minPrice),maxPrice=Number(tr.dataset.maxPrice),roundedMin=Number(min.toFixed(2)),roundedMax=Number(max.toFixed(2));let next=base*(1-v/100);if(Number.isFinite(minPrice)&&v>=min&&v<=roundedMin)next=minPrice;else if(Number.isFinite(maxPrice)&&v>=max&&v<=roundedMax)next=maxPrice;const cells=Array.from(tr.children);const headers=Array.from(tr.closest('table').querySelectorAll('thead th')).map(x=>x.textContent.replace(/[▲▼•]/g,'').trim());const priceIndex=headers.indexOf('Новая цена');if(priceIndex>=0&&cells[priceIndex])cells[priceIndex].textContent=Number.isFinite(next)?Math.round(next).toString():'';cell.textContent=v.toFixed(2)+'%';val({action:'discount',product_id:pid,discount:v,event_id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2))});};i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit()}else if(e.key==='Escape'){e.preventDefault();done=true;render()}});i.addEventListener('blur',commit)}
window.addEventListener('message',e=>{if(e.data?.type!==RENDER)return;args=e.data.args||{};applyTheme(e.data.theme||{});syncSelection();applyFrameHeight();render()});window.addEventListener('load',()=>{applyFrameHeight();send(READY,{apiVersion:1});send(HEIGHT,{height:frameHeight()})})})();
</script></body></html>
